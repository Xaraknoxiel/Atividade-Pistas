upstream {
    server app:3000;
}

server {
    listen 8080 default_server;
    server_name _;

    location / {
        proxy_pass http://app;
    }

    location /main {
        proxy_pass http://app/main;
    }

    location /clue1 {
        proxy_pass http://app/clue1;
    }

    location /clue2 {
        proxy_pass http://app/clue2;
    }

    location /clue3 {
        proxy_pass http://app/clue3;
    }

    location /clue4 {
        proxy_pass http://app/clue4;
    }
    
    location /clue5 {
        proxy_pass http://app/clue5;
    }
}